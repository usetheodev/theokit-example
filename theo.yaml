# Legacy app-shape descriptor consumed by @theo/cli for validation
# (per Plan v1.1 T1.2 / ADR D6 — theo.yaml stays in the transition window
# for app validation; the upload payload uses .theo/services.json).
#
# Canonical 2026-06-16: `runtime: node` + `start: theokit start`. The
# start command is required by the canonical Dockerfile generator
# (api/internal/argo/canonical_dockerfile.go). Without it, build fails
# at generate-dockerfile with "app 'web' has no declared start command".
project: theokit-example
apps:
  web:
    path: .
    runtime: node
    type: server
    port: 3000
    start: theokit start
    build: buildpack
